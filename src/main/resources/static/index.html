<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar capacitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-in">
      <a class="marca" href="index.html">Cursos y procesos</a>
      <nav class="nav" aria-label="Principal">
        <a href="index.html" aria-current="page">Solicitar capacitación</a>
        <a href="panel-empresa.html">Seguimiento</a>
        <a href="panel-admin.html">Administración</a>
        <a href="panel-docente.html">Docentes</a>
      </nav>
    </div>
  </header>

  <main class="pagina">
    <div class="encabezado">
      <div>
        <h1>Solicitar una capacitación</h1>
        <p>La solicitud pasa primero por revisión administrativa y después se asigna un docente.</p>
      </div>
    </div>

    <section class="bloque">
      <form id="form-solicitud">
        <div class="campos">
          <div class="campo">
            <label for="cursoId">Código de solicitud</label>
            <input type="text" id="cursoId" placeholder="CURSO-TECH-2026" required>
          </div>
          <div class="campo">
            <label for="nombreEmpresa">Empresa o institución</label>
            <input type="text" id="nombreEmpresa" placeholder="Tech Solutions S.A." required>
          </div>
          <div class="campo">
            <label for="tematica">Nombre del curso</label>
            <input type="text" id="tematica" placeholder="Modelado BPMN 2.0 y arquitectura de procesos" required>
          </div>
          <div class="campo">
            <label for="categoria">Área académica</label>
            <select id="categoria" required>
              <option value="">Elegir un área</option>
              <option value="Ingeniería y Procesos">Ingeniería y procesos de negocio</option>
              <option value="Tecnologías de la Información">Tecnologías de la información</option>
              <option value="Gestión Empresarial">Gestión y dirección empresarial</option>
              <option value="Transformación Digital">Transformación digital</option>
            </select>
          </div>
          <div class="campo">
            <label for="emailSolicitante">Correo de contacto</label>
            <input type="email" id="emailSolicitante" placeholder="contacto@empresa.com" required>
          </div>
          <div class="campo">
            <label for="participantes">Cantidad de participantes</label>
            <input type="number" id="participantes" min="1" max="500" placeholder="25" required>
          </div>
          <div class="campo ancho">
            <label for="descripcion">Objetivos y requerimientos <span class="pista">(opcional)</span></label>
            <textarea id="descripcion" placeholder="Perfil de los participantes y qué se espera lograr"></textarea>
          </div>
        </div>

        <div class="acciones">
          <button type="reset" class="boton boton-sec">Borrar campos</button>
          <button type="submit" id="btn-enviar" class="boton">Enviar solicitud</button>
        </div>
      </form>
    </section>

    <section id="confirmacion" class="bloque" hidden>
      <h2>Solicitud enviada</h2>
      <dl class="datos">
        <div><dt>Número de proceso</dt><dd id="conf-proceso" class="codigo"></dd></div>
        <div><dt>Código del curso</dt><dd id="conf-curso" class="codigo"></dd></div>
        <div><dt>Estado</dt><dd><span class="estado curso">En proceso</span></dd></div>
      </dl>
      <div class="acciones">
        <a id="btn-ver-estado" href="panel-empresa.html" class="boton">Seguir esta solicitud</a>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    $('cursoId').value = 'CURSO-' + Math.floor(1000 + Math.random() * 9000);

    $('form-solicitud').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btn-enviar');

      const payload = {
        cursoId: $('cursoId').value.trim(),
        nombreCurso: $('tematica').value.trim(),
        categoria: $('categoria').value,
        emailSolicitante: $('emailSolicitante').value.trim(),
        cupoMaximo: parseInt($('participantes').value, 10),
        descripcion: $('descripcion').value.trim()
      };

      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const r = await api.iniciarProceso(payload);
        showToast('Solicitud enviada', 'success');

        $('conf-proceso').textContent = r.processInstanceId;
        $('conf-curso').textContent = r.businessKey;
        $('btn-ver-estado').href = `panel-empresa.html?id=${encodeURIComponent(r.businessKey)}`;
        $('confirmacion').hidden = false;
        $('confirmacion').scrollIntoView({ behavior: 'smooth' });
        e.target.reset();
      } catch (err) {
        console.error(err);
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar solicitud';
      }
    });
  </script>
</body>
</html>
