<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docentes: tareas pendientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera-movil">
    <div>
      <h1>Tareas docentes</h1>
      <span class="rol" id="rol"></span>
    </div>
    <button type="button" id="btn-actualizar" class="boton boton-sec chico">Actualizar</button>
  </header>

  <main class="movil">
    <div class="campo">
      <label for="usuario">Docente</label>
      <select id="usuario"></select>
    </div>

    <p id="aviso" class="aviso" role="status" hidden></p>
    <div id="tareas"><p class="cargando">Cargando tareas…</p></div>

    <nav class="pie-nav" aria-label="Otras pantallas">
      <a href="index.html">Solicitar capacitación</a>
      <a href="panel-admin.html">Administración</a>
      <a href="panel-empresa.html">Seguimiento</a>
    </nav>
  </main>

  <script>
    const API = '/api/v1/cursos/procesos';
    const DOCENTES = [
      { id: 'docente_carlos', nombre: 'Carlos Rodríguez', rol: 'Jefe docente' },
      { id: 'docente_ana',    nombre: 'Ana Fernández',    rol: 'Docente' },
      { id: 'docente_pedro',  nombre: 'Pedro López',      rol: 'Docente' }
    ];
    const $ = (id) => document.getElementById(id);

    function h(tag, attrs = {}, ...hijos) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
      el.append(...hijos);
      return el;
    }

    const opciones = () => DOCENTES.map((d) => h('option', { value: d.id }, `${d.nombre} (${d.rol.toLowerCase()})`));
    const dato = (etiqueta, ...valor) => h('p', {}, h('b', {}, etiqueta + ': '), ...valor);

    function avisar(texto, error = false) {
      const el = $('aviso');
      el.textContent = texto;
      el.className = 'aviso' + (error ? ' error' : '');
      el.hidden = !texto;
    }

    function tarjeta(t) {
      const v = t.variables || {};
      const curso = dato('Curso', `${v.nombreCurso || 'Curso de capacitación'} `, h('span', { class: 'codigo' }, v.cursoId || 'S/C'));
      const art = h('article', { class: 'tarea' }, h('h3', {}, t.taskName), curso);

      if (t.taskName === 'Definir Docente que desarrolla el curso') {
        const sel = h('select', { id: 'docente-' + t.taskId }, ...opciones());
        art.append(
          dato('Cupo estimado', `${v.cupoMaximo || 20} alumnos`),
          h('div', { class: 'campo' }, h('label', { for: sel.id }, 'Docente a cargo'), sel),
          h('button', { type: 'button', class: 'boton', onclick: () => enviar(t.taskId, {
            aprobado: true,
            observaciones: `Docente asignado: ${sel.value}`,
            variablesAdicionales: { docenteAsignado: sel.value }
          }) }, 'Asignar docente')
        );
      } else if (t.taskName === 'Desarrollar curso') {
        art.append(
          dato('Docente responsable', t.assignee || '—'),
          dato('Fecha de inicio', v.fechaInicioCurso || 'A convenir'),
          h('button', { type: 'button', class: 'boton boton-ok', onclick: () => {
            if (!confirm('¿Se dictaron todas las clases del curso?')) return;
            enviar(t.taskId, {
              aprobado: true,
              observaciones: 'Dictado del curso concluido.',
              variablesAdicionales: { dictadoCompletado: 'Completado con éxito' }
            });
          } }, 'Registrar dictado terminado')
        );
      } else if (t.taskName === 'Elaborar informe de resultados') {
        const txt = h('textarea', { id: 'informe-' + t.taskId, placeholder: 'Resumen del dictado, asistencia y competencias alcanzadas' });
        art.append(
          h('div', { class: 'campo' }, h('label', { for: txt.id }, 'Resultados del dictado'), txt),
          h('button', { type: 'button', class: 'boton', onclick: () => {
            const texto = txt.value.trim();
            if (!texto) { avisar('Escribí el informe antes de enviarlo.', true); txt.focus(); return; }
            enviar(t.taskId, { aprobado: true, observaciones: texto, variablesAdicionales: { informeResultados: texto } });
          } }, 'Enviar informe')
        );
      } else {
        art.append(h('button', { type: 'button', class: 'boton', onclick: () => enviar(t.taskId, {
          aprobado: true,
          observaciones: 'Completado desde el portal docente'
        }) }, 'Completar tarea'));
      }
      return art;
    }

    async function cargar() {
      avisar('');
      $('tareas').replaceChildren(h('p', { class: 'cargando' }, 'Cargando tareas…'));
      try {
        const res = await fetch(`${API}/tareas/pendientes?usuario=${encodeURIComponent($('usuario').value)}`);
        const json = await res.json();
        const tareas = json.datos || [];
        $('tareas').replaceChildren(...(tareas.length
          ? tareas.map(tarjeta)
          : [h('p', { class: 'vacio' }, 'No hay tareas pendientes.')]));
      } catch (err) {
        $('tareas').replaceChildren();
        avisar('No se pudo conectar con el servidor: ' + err.message, true);
      }
    }

    async function enviar(taskId, payload) {
      try {
        const res = await fetch(`${API}/tareas/${taskId}/completar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          avisar(err.mensaje || 'No se pudo completar la tarea.', true);
          return;
        }
        await cargar();
        avisar('Tarea completada.');
      } catch (e) {
        avisar('Error de conexión: ' + e.message, true);
      }
    }

    function actualizarRol() {
      const d = DOCENTES.find((x) => x.id === $('usuario').value);
      $('rol').textContent = d.rol;
    }

    $('usuario').append(...opciones());
    $('usuario').addEventListener('change', () => { actualizarRol(); cargar(); });
    $('btn-actualizar').addEventListener('click', cargar);
    actualizarRol();
    cargar();
  </script>
</body>
</html>
